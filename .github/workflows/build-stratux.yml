name: Build Stratux NX Full Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_image:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout custom project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: custom

      - name: Checkout latest Stratux master
        uses: actions/checkout@v4
        with:
          repository: stratux/stratux
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: stratux

      - name: Show upstream version
        run: |
          cd stratux
          echo "Building Stratux upstream commit:"
          git log -1 --oneline

      - name: Apply our custom changes
        run: |
          set -euo pipefail
          echo "Applying Stratux NX custom overlay..."
          rsync -av custom/overlay/ stratux/
          chmod +x custom/apply-custom.sh
          custom/apply-custom.sh stratux

      - name: Verify complete Stratux NX source
        run: |
          set -euo pipefail

          test -f stratux/main/datausage.go
          test -f stratux/main/flightlog.go
          test -f stratux/main/flightlog_sync.go
          test -f stratux/main/flightlog_context.go
          test -f stratux/main/flightlog_weather.go
          test -f stratux/main/ahrs_v2.go
          test -f stratux/LICENSE
          test -f stratux/debian/copyright
          test -f stratux/debian/stratux-nx-license
          test -f stratux/debian/STRATUX-NX-NOTICES.md
          test -f stratux/scripts/collect-licenses.go

          test -f stratux/web/plates/datausage.html
          test -f stratux/web/plates/flightlog.html
          test -f stratux/web/plates/about.html
          test -f stratux/web/plates/js/datausage.js
          test -f stratux/web/plates/js/flightlog.js
          test -f stratux/web/plates/js/guardian.js
          test -f stratux/web/css/datausage.css
          test -f stratux/web/css/map-nx.css
          test -f stratux/web/css/pages-nx.css
          test -f stratux/web/css/update.css
          test -f stratux/web/css/about.css
          test -f stratux/web/css/guardian.css
          test -f stratux/web/js/map-nx.js
          test -f stratux/web/plates/update.html
          test -f stratux/web/plates/js/update.js
          test -f stratux/main/updater.go
          test -f stratux/web/img/logo-nx.png
          test -f stratux/web/img/logo-android3.png
          test -f stratux/web/img/logo-apple3.png
          test -f stratux/web/img/logo-stratux-light.png
          test -f stratux/web/img/logo-stratux-dark.png
          test -f stratux/web/img/lemonpot.ico
          grep -q 'class="sx-navbar-name">Stratux NX</span>' stratux/web/index.html
          grep -q 'BASED ON OPEN-SOURCE STRATUX' stratux/web/plates/about.html
          grep -q 'ADAPTED AND MAINTAINED BY LEMONPOT INC.' stratux/web/plates/about.html
          grep -q 'adapted and maintained by Lemonpot' stratux/web/plates/about.html
          grep -q 'More than one restart is normal' stratux/web/plates/settings.html
          grep -q 'updateInProgress' stratux/web/plates/js/update.js

          grep -q "Internet Data" stratux/web/index.html
          grep -q "Flight Log" stratux/web/index.html
          grep -q "NX Guardian" stratux/web/plates/status.html
          grep -q "plates/js/guardian.js" stratux/web/index.html
          grep -q 'captureFlightWeatherText(wm)' stratux/main/gen_gdl90.go
          grep -q 'captureFlightNEXRADFrame' stratux/main/gen_gdl90.go
          grep -q 'captureFlightGPSStatusSnapshot' stratux/main/gen_gdl90.go
          grep -q 'captureFlightReceptionSnapshot' stratux/main/gen_gdl90.go
          grep -q 'flightTrackPointPlausibleLocked' stratux/main/flightlog.go
          grep -q 'freq_list=2412 2417 2422' stratux/debian/wpa_supplicant.conf.template
          grep -q 'WPA_CONFIG="/etc/wpa_supplicant/wpa_supplicant.conf"' stratux/debian/postinst.dpkg
          grep -q 'handleDataUsagePolicy' stratux/main/datausage.go
          grep -q 'dataUsageLimitKeys' stratux/main/datausage.go
          grep -q 'c.Exempt, c.LimitMB' stratux/main/datausage_wire.go
          grep -q 'applyDevicePolicy' stratux/web/plates/js/datausage.js
          grep -q 'Automatic limit for this device' stratux/web/plates/datausage.html
          grep -q 'href="#/about"' stratux/web/index.html
          grep -q 'sx-sidebar-brand' stratux/web/index.html
          grep -q "state('about'" stratux/web/js/main.js
          grep -q 'Maintainer: Lemonpot' stratux/debian/control.dpkg
          grep -q 'scripts/collect-licenses.go' stratux/Makefile
          grep -q "ResetInvalid" stratux/main/sensors.go
          grep -q 'NX_OTA_INSTALL' stratux/debian/preinst.dpkg
          grep -q 'NX_OTA_INSTALL' stratux/debian/prerm.dpkg
          grep -q 'NX_OTA_INSTALL' stratux/debian/postinst.dpkg
          grep -q 'last-install.log' stratux/debian/stratux-pre-start.sh

          echo "Complete Stratux NX source verified"

      - name: Commit customizations for pi-gen
        run: |
          set -euo pipefail

          cd stratux

          git config user.email "build@local"
          git config user.name "Stratux NX Build"

          git switch -c stratux-nx-build
          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: no custom changes were staged"
            exit 1
          fi

          git commit -m "Build complete Stratux NX customization"

          git show HEAD:main/ahrs_v2.go >/dev/null
          git show HEAD:main/datausage.go >/dev/null
          git show HEAD:main/flightlog.go >/dev/null
          git show HEAD:main/flightlog_sync.go >/dev/null
          git show HEAD:web/index.html | grep -q "Internet Data"
          git show HEAD:web/index.html | grep -q "Flight Log"

          echo "Committed source used by pi-gen:"
          git log -1 --oneline

      - name: Package corresponding source
        run: |
          set -euo pipefail
          VERSION=$(awk '/^VERSIONSTR :=/{print $3}' stratux/Makefile)
          SOURCE_ROOT="corresponding-source/stratux-nx-${VERSION}"
          mkdir -p "$SOURCE_ROOT/stratux" "$SOURCE_ROOT/stratux-nx-customizations"
          git -C stratux archive HEAD | tar -x -C "$SOURCE_ROOT/stratux"
          git -C custom archive "$GITHUB_SHA" | tar -x -C "$SOURCE_ROOT/stratux-nx-customizations"
          for submodule in dump1090 rtl-ais ogn/ogn-tracker image_build/pi-gen; do
            mkdir -p "$SOURCE_ROOT/stratux/$submodule"
            git -C "stratux/$submodule" archive HEAD | tar -x -C "$SOURCE_ROOT/stratux/$submodule"
          done
          {
            echo "Stratux NX version: $VERSION"
            echo "Stratux NX commit: $GITHUB_SHA"
            echo "Stratux upstream commit: $(git -C stratux rev-parse HEAD^)"
            git -C stratux submodule status --recursive
          } > "$SOURCE_ROOT/BUILD-SOURCE.txt"
          tar -C corresponding-source -czf "stratux-nx-${VERSION}-corresponding-source.tar.gz" "stratux-nx-${VERSION}"
          echo "NX_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NX_SOURCE_ARCHIVE=stratux-nx-${VERSION}-corresponding-source.tar.gz" >> "$GITHUB_ENV"

      - name: Build Stratux NX image
        run: |
          set -euo pipefail
          cd stratux/image_build
          ./build.sh

      - name: Extract OTA update package
        run: |
          set -euo pipefail
          mkdir -p ota-update
          echo "Searching for .deb files..."
          find stratux/ -name '*.deb' -ls || true
          find stratux/ -name '*.deb' -exec cp {} ota-update/ \;
          ls -lh ota-update/
          if [ -z "$(ls ota-update/*.deb 2>/dev/null)" ]; then
            echo "WARNING: no .deb found, OTA package not available"
          else
            DEB_FILE=$(ls ota-update/*.deb | head -1)
            dpkg-deb -c "$DEB_FILE" > /tmp/stratux-deb-contents.txt
            grep -q './usr/share/doc/stratux/copyright' /tmp/stratux-deb-contents.txt
            grep -q './usr/share/doc/stratux/licenses/INDEX.txt' /tmp/stratux-deb-contents.txt
            grep -q 'stratux-nx-notices' /tmp/stratux-deb-contents.txt
          fi

      - name: Show generated files
        run: |
          find stratux/image_build/pi-gen/deploy -maxdepth 1 -type f -ls

      - name: Upload Stratux NX image
        uses: actions/upload-artifact@v4
        with:
          name: stratux-nx-full-image
          path: stratux/image_build/pi-gen/deploy/*
          compression-level: 0
          if-no-files-found: error

      - name: Upload OTA update package
        uses: actions/upload-artifact@v4
        if: hashFiles('ota-update/*.deb') != ''
        with:
          name: stratux-nx-ota-update
          path: ota-update/*.deb
          compression-level: 0
          if-no-files-found: warn

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: stratux-nx-corresponding-source
          path: ${{ env.NX_SOURCE_ARCHIVE }}
          compression-level: 0
          if-no-files-found: error

      - name: Publish permanent release and source
        if: hashFiles('ota-update/*.deb') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEB_FILE=$(ls ota-update/*.deb | head -1)
          TAG="nx-${NX_RELEASE_VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Stratux NX ${NX_RELEASE_VERSION}" \
              --notes "Stratux NX OTA package and complete corresponding source for this binary release." \
              --prerelease
          fi
          gh release upload "$TAG" "$DEB_FILE" "$NX_SOURCE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish OTA to update server
        if: hashFiles('ota-update/*.deb') != ''
        env:
          NX_UPDATE_API_KEY: ${{ secrets.NX_UPDATE_API_KEY }}
          NX_SSH_HOST: ${{ secrets.NX_SSH_HOST }}
          NX_SSH_USER: ${{ secrets.NX_SSH_USER }}
          NX_SSH_PASS: ${{ secrets.NX_SSH_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1 || true

          DEB_FILE=$(ls ota-update/*.deb | head -1)
          VERSION=$(dpkg-deb -f "$DEB_FILE" Version 2>/dev/null || echo "$(date +%Y%m%d)-${GITHUB_SHA:0:7}")
          REMOTE_PATH="/tmp/stratux-nx-${VERSION}.deb"

          echo "Uploading $DEB_FILE to server via SCP..."
          sshpass -p "$NX_SSH_PASS" scp -o StrictHostKeyChecking=no "$DEB_FILE" "${NX_SSH_USER}@${NX_SSH_HOST}:${REMOTE_PATH}"
          echo "SCP complete. Registering version $VERSION..."

          curl -sf -X POST \
            -H "X-API-Key: $NX_UPDATE_API_KEY" \
            -d "version=$VERSION" \
            -d "local_path=$REMOTE_PATH" \
            "https://api.stratuxnx.com/v1/update/publish"

          echo ""
          echo "Verifying publish..."
          curl -sf "https://api.stratuxnx.com/v1/update/check?v=0.0.0"
