name: Build Stratux NX Full Image

on:
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout custom project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: custom

      - name: Checkout latest Stratux master
        uses: actions/checkout@v4
        with:
          repository: stratux/stratux
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: stratux

      - name: Show upstream version
        run: |
          cd stratux
          echo "Building Stratux upstream commit:"
          git log -1 --oneline

      - name: Apply our custom changes
        run: |
          set -euo pipefail
          echo "Applying Stratux NX custom overlay..."
          rsync -av custom/overlay/ stratux/
          chmod +x custom/apply-custom.sh
          custom/apply-custom.sh stratux

      - name: Verify complete Stratux NX source
        run: |
          set -euo pipefail

          test -f stratux/main/datausage.go
          test -f stratux/main/flightlog.go
          test -f stratux/main/ahrs_v2.go

          test -f stratux/web/plates/datausage.html
          test -f stratux/web/plates/flightlog.html
          test -f stratux/web/plates/js/datausage.js
          test -f stratux/web/plates/js/flightlog.js
          test -f stratux/web/css/datausage.css

          grep -q "Internet Data" stratux/web/index.html
          grep -q "Flight Log" stratux/web/index.html
          grep -q "Adaptive AHRS v2" stratux/web/plates/settings.html
          grep -q "ResetInvalid" stratux/main/sensors.go

          echo "Complete Stratux NX source verified"

      - name: Commit customizations for pi-gen
        run: |
          set -euo pipefail

          cd stratux

          git config user.email "build@local"
          git config user.name "Stratux NX Build"

          git switch -c stratux-nx-build
          git add -A

          if git diff --cached --quiet; then
            echo "ERROR: no custom changes were staged"
            exit 1
          fi

          git commit -m "Build complete Stratux NX customization"

          git show HEAD:main/ahrs_v2.go >/dev/null
          git show HEAD:main/datausage.go >/dev/null
          git show HEAD:main/flightlog.go >/dev/null
          git show HEAD:web/plates/settings.html | grep -q "Adaptive AHRS v2"
          git show HEAD:web/index.html | grep -q "Internet Data"
          git show HEAD:web/index.html | grep -q "Flight Log"

          echo "Committed source used by pi-gen:"
          git log -1 --oneline

      - name: Build Stratux NX image
        run: |
          set -euo pipefail
          cd stratux/image_build
          ./build.sh

      - name: Show generated files
        run: |
          find stratux/image_build/pi-gen/deploy -maxdepth 1 -type f -ls

      - name: Upload Stratux NX image
        uses: actions/upload-artifact@v4
        with:
          name: stratux-nx-full-image
          path: stratux/image_build/pi-gen/deploy/*
          compression-level: 0
          if-no-files-found: error
