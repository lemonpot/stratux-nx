name: Stage Stratux NX Cloud

on:
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate cloud application
        run: |
          set -euo pipefail
          php -l server/lib.php
          php -l server/flight-memory.php
          php -l server/web/index.php
          php server/tests/flight-memory-test.php
          node --check server/web/flight-memory.js
          bash -n server/deploy-as-root.sh
          test -f server/web/flight-memory.css

      - name: Package cloud application
        run: tar -C server -czf /tmp/stratuxnx-cloud.tgz .

      - name: Stage cloud application
        env:
          NX_SSH_HOST: ${{ secrets.NX_SSH_HOST }}
          NX_SSH_USER: ${{ secrets.NX_SSH_USER }}
          NX_SSH_PASS: ${{ secrets.NX_SSH_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh_opts=(-o StrictHostKeyChecking=no)
          remote_release="/home/virtual/stratux/stratuxnx-cloud-release"
          sshpass -p "$NX_SSH_PASS" scp "${ssh_opts[@]}" /tmp/stratuxnx-cloud.tgz \
            "${NX_SSH_USER}@${NX_SSH_HOST}:/tmp/stratuxnx-cloud.tgz"
          sshpass -p "$NX_SSH_PASS" ssh "${ssh_opts[@]}" "${NX_SSH_USER}@${NX_SSH_HOST}" \
            "rm -rf '${remote_release}.new' && mkdir -p '${remote_release}.new' && tar -xzf /tmp/stratuxnx-cloud.tgz -C '${remote_release}.new' && rm -f /tmp/stratuxnx-cloud.tgz && rm -rf '${remote_release}' && mv '${remote_release}.new' '${remote_release}'"
          echo "Cloud release staged. Root must run deploy-as-root.sh to publish it."
