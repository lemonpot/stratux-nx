name: AHRS regression tests
on:
  push:
    paths: ['overlay/main/ahrs_v2*.go', 'tests/**', 'patch-ahrs-v2.py', '.github/workflows/test-ahrs.yml']
  pull_request:
    paths: ['overlay/main/ahrs_v2*.go', 'tests/**', 'patch-ahrs-v2.py', '.github/workflows/test-ahrs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - run: bash tests/test-ahrs.sh
